# fly.toml app configuration file generated for article-recommender-system on 2025-05-01T01:52:09+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'article-recommender-system'
primary_region = 'sin'

[build]
dockerfile = 'Containerfile'

[[services]]
protocol = 'tcp'
internal_port = 50051
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[services.ports]]
port = 443
handlers = ['tls']


[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
port = 50051
grace_period = "45s"

[services.ports.tls_options]
alpn = ['h2']

[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
